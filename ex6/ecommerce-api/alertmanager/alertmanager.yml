
global:
  resolve_timeout: 5m

route:
  receiver: 'webhook-notifications'
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'webhook-notifications'
    webhook_configs:
      - url: 'http://ecommerce-api:8080/webhook/alerts'
        send_resolved: true
